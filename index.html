<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coquette Sparkle Calculator ✨ 🎀</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka & Quicksand for maximum cuteness -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Custom Theme CSS Variables */
        :root {
            --bg-gradient: linear-gradient(135deg, #ffd1dc 0%, #ffe4e1 50%, #f0e6ff 100%);
            --calc-bg: rgba(255, 255, 255, 0.65);
            --calc-border: rgba(255, 182, 193, 0.8);
            --calc-shadow: 0 20px 50px rgba(236, 72, 153, 0.2);
            --display-bg: rgba(255, 245, 248, 0.85);
            --display-text: #834358;
            --btn-num-bg: #ffffff;
            --btn-num-text: #704253;
            --btn-op-bg: #ffe4ec;
            --btn-op-text: #db2777;
            --btn-action-bg: #f3e8ff;
            --btn-action-text: #9333ea;
            --btn-equals-bg: linear-gradient(135deg, #f472b6, #ec4899);
            --btn-equals-text: #ffffff;
            --accent-glow: rgba(244, 114, 182, 0.5);
            --ribbon-color: #f472b6;
        }

        /* Pastel Dream Theme */
        body.theme-pastel {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
            --calc-bg: rgba(255, 255, 255, 0.7);
            --calc-border: rgba(186, 230, 253, 0.9);
            --calc-shadow: 0 20px 50px rgba(56, 189, 248, 0.2);
            --display-bg: rgba(240, 249, 255, 0.85);
            --display-text: #0369a1;
            --btn-num-bg: #ffffff;
            --btn-num-text: #334155;
            --btn-op-bg: #e0f2fe;
            --btn-op-text: #0284c7;
            --btn-action-bg: #fef3c7;
            --btn-action-text: #d97706;
            --btn-equals-bg: linear-gradient(135deg, #38bdf8, #818cf8);
            --btn-equals-text: #ffffff;
            --accent-glow: rgba(56, 189, 248, 0.5);
            --ribbon-color: #38bdf8;
        }

        /* Purple Sparkle Theme */
        body.theme-lavender {
            --bg-gradient: linear-gradient(135deg, #e9d5ff 0%, #f3e8ff 50%, #fbcfe8 100%);
            --calc-bg: rgba(255, 255, 255, 0.7);
            --calc-border: rgba(216, 180, 254, 0.9);
            --calc-shadow: 0 20px 50px rgba(168, 85, 247, 0.25);
            --display-bg: rgba(250, 245, 255, 0.85);
            --display-text: #581c87;
            --btn-num-bg: #ffffff;
            --btn-num-text: #4c1d95;
            --btn-op-bg: #f3e8ff;
            --btn-op-text: #9333ea;
            --btn-action-bg: #fce7f3;
            --btn-action-text: #db2777;
            --btn-equals-bg: linear-gradient(135deg, #c084fc, #a855f7);
            --btn-equals-text: #ffffff;
            --accent-glow: rgba(192, 132, 252, 0.5);
            --ribbon-color: #c084fc;
        }

        body {
            background: var(--bg-gradient);
            transition: background 0.5s ease;
            overflow-x: hidden;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: var(--calc-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 3px solid var(--calc-border);
            box-shadow: var(--calc-shadow);
        }

        .glass-display {
            background: var(--display-bg);
            color: var(--display-text);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
        }

        /* Button Custom Styling */
        .calc-btn {
            position: relative;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }

        .calc-btn:active, .calc-btn.pressed {
            transform: scale(0.92) translateY(2px);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .calc-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .calc-btn:hover::after {
            opacity: 0.4;
        }

        .btn-num {
            background-color: var(--btn-num-bg);
            color: var(--btn-num-text);
        }

        .btn-op {
            background-color: var(--btn-op-bg);
            color: var(--btn-op-text);
            font-weight: 600;
        }

        .btn-action {
            background-color: var(--btn-action-bg);
            color: var(--btn-action-text);
            font-weight: 600;
        }

        .btn-equals {
            background: var(--btn-equals-bg);
            color: var(--btn-equals-text);
            box-shadow: 0 6px 15px var(--accent-glow);
        }

        /* Floating background items */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Particle Burst for Sparkles on C press */
        .burst-particle {
            position: absolute;
            pointer-events: none;
            animation: particleBurst 0.8s ease-out forwards;
            z-index: 50;
        }

        @keyframes particleBurst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }

        /* Pulse / Heartbeat animations */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .animate-heartbeat {
            animation: heartbeat 2s infinite ease-in-out;
        }

        /* Sticker Look */
        .sticker {
            background: white;
            padding: 4px 8px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 2px solid #fbcfe8;
            transform: rotate(-3deg);
            display: inline-block;
        }

        /* Scrollbar styles for history drawer */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(244, 114, 182, 0.5);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(244, 114, 182, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 relative overflow-x-hidden select-none">

    <div id="particleContainer" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <div class="relative z-10 w-full max-w-md">
        
        <!-- Top Cute Header Decoration -->
        <div class="flex justify-between items-center mb-2 px-3">
            <div class="flex items-center space-x-2">
                <span class="text-2xl animate-heartbeat inline-block">🎀</span>
                <span class="font-bold text-pink-600 tracking-wider text-sm sm:text-base drop-shadow-sm uppercase">Princess Calc</span>
            </div>
            
            <!-- Controls: Theme Toggle, Sound Toggle & History Button -->
            <div class="flex items-center space-x-2">
                <button id="soundToggle" title="Toggle Sound" class="w-9 h-9 rounded-full bg-white/80 hover:bg-white text-pink-500 flex items-center justify-center shadow-md transition-all hover:scale-110 active:scale-95">
                    <i class="fas fa-volume-up text-sm" id="soundIcon"></i>
                </button>
                <button id="themeToggle" title="Change Theme" class="w-9 h-9 rounded-full bg-white/80 hover:bg-white text-pink-500 flex items-center justify-center shadow-md transition-all hover:scale-110 active:scale-95">
                    <i class="fas fa-palette text-sm"></i>
                </button>
                <button id="historyToggle" title="History Drawer" class="w-9 h-9 rounded-full bg-white/80 hover:bg-white text-pink-500 flex items-center justify-center shadow-md transition-all hover:scale-110 active:scale-95 relative">
                    <i class="fas fa-clock-rotate-left text-sm"></i>
                    <span id="historyBadge" class="hidden absolute -top-1 -right-1 w-3 h-3 bg-pink-500 rounded-full border-2 border-white"></span>
                </button>
            </div>
        </div>

        <!-- Calculator Main Body -->
        <div id="calcBody" class="glass-panel rounded-3xl p-4 sm:p-6 relative transition-all duration-300">
            
            <!-- Cute Ribbon Centerpiece -->
            <div class="absolute -top-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none">
                <div class="bg-pink-400 text-white px-4 py-1 rounded-full text-xs font-bold shadow-md flex items-center space-x-1 border-2 border-white">
                    <span>✨</span>
                    <span id="themeLabel">Pink Sparkle</span>
                    <span>✨</span>
                </div>
            </div>

            <div class="glass-display rounded-2xl p-4 mb-5 text-right relative overflow-hidden transition-all">
                <!-- Expression / Secondary Display -->
                <div id="expressionDisplay" class="h-6 text-xs sm:text-sm text-pink-400/80 font-medium overflow-x-auto whitespace-nowrap scrollbar-none flex items-center justify-end">
                    <span>Ready ~ 🌸</span>
                </div>
                
                <!-- Main Input & Result Display -->
                <div class="flex items-center justify-between mt-1">
                    <span class="text-xs font-semibold text-pink-300 tracking-wider">CALC</span>
                    <div id="mainDisplay" class="text-3xl sm:text-4xl font-bold tracking-tight text-pink-700 truncate max-w-[85%]">
                        0
                    </div>
                </div>

                <!-- Cute Easter Egg Toast Banner inside screen -->
                <div id="easterEggToast" class="absolute inset-0 bg-pink-100/95 backdrop-blur-sm flex items-center justify-center px-4 text-center text-pink-600 font-bold text-sm sm:text-base rounded-2xl transition-all duration-300 transform translate-y-full opacity-0 pointer-events-none">
                    <span id="easterEggText">✨ Cute Alert! ✨</span>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2.5 sm:gap-3">
                <!-- Row 1 -->
                <button data-action="clear" class="calc-btn btn-action rounded-2xl p-3.5 sm:p-4 text-base sm:text-lg flex items-center justify-center">
                    C
                </button>
                <button data-action="toggle-sign" class="calc-btn btn-action rounded-2xl p-3.5 sm:p-4 text-base sm:text-lg flex items-center justify-center">
                    ⁺/₋
                </button>
                <button data-action="percent" class="calc-btn btn-action rounded-2xl p-3.5 sm:p-4 text-base sm:text-lg flex items-center justify-center">
                    %
                </button>
                <button data-op="÷" class="calc-btn btn-op rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl flex items-center justify-center">
                    ÷
                </button>

                <!-- Row 2 -->
                <button data-num="7" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    7
                </button>
                <button data-num="8" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    8
                </button>
                <button data-num="9" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    9
                </button>
                <button data-op="×" class="calc-btn btn-op rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl flex items-center justify-center">
                    ×
                </button>

                <!-- Row 3 -->
                <button data-num="4" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    4
                </button>
                <button data-num="5" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    5
                </button>
                <button data-num="6" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    6
                </button>
                <button data-op="-" class="calc-btn btn-op rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl flex items-center justify-center">
                    -
                </button>

                <!-- Row 4 -->
                <button data-num="1" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    1
                </button>
                <button data-num="2" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    2
                </button>
                <button data-num="3" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    3
                </button>
                <button data-op="+" class="calc-btn btn-op rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl flex items-center justify-center">
                    +
                </button>

                <!-- Row 5 -->
                <button data-action="sqrt" class="calc-btn btn-action rounded-2xl p-3.5 sm:p-4 text-base sm:text-lg flex items-center justify-center">
                    √
                </button>
                <button data-num="0" class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    0
                </button>
                <button data-num="." class="calc-btn btn-num rounded-2xl p-3.5 sm:p-4 text-lg sm:text-xl font-bold flex items-center justify-center">
                    .
                </button>

                <!-- Backspace Button -->
                <button data-action="backspace" class="calc-btn btn-action rounded-2xl p-3.5 sm:p-4 text-base sm:text-lg flex items-center justify-center">
                    <i class="fas fa-backspace"></i>
                </button>
            </div>

            <!-- Equals Button (Full Width Bottom Bar) -->
            <button data-action="calculate" class="calc-btn btn-equals w-full mt-3 rounded-2xl p-3.5 text-xl font-bold flex items-center justify-center space-x-2">
                <span>=</span>
                <span class="text-sm">💖</span>
            </button>

            <!-- Cute Bottom Decoration Sticker -->
            <div class="mt-4 flex justify-between items-center text-xs text-pink-400 font-semibold px-1">
                <span>🎀 Sweet & Smart</span>
                <span>xoxo 💕</span>
            </div>
        </div>

        <div id="historyDrawer" class="fixed inset-y-0 right-0 w-80 max-w-[85vw] glass-panel bg-white/90 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out p-5 flex flex-col rounded-l-3xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-pink-200">
                <div class="flex items-center space-x-2">
                    <span class="text-xl">📜</span>
                    <h3 class="font-bold text-pink-600 text-lg">Calc History</h3>
                </div>
                <button id="closeHistory" class="w-8 h-8 rounded-full bg-pink-100 text-pink-500 hover:bg-pink-200 flex items-center justify-center transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div id="historyList" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- History items will be dynamically injected here -->
                <div class="text-center text-pink-300 text-sm py-10">
                    <p class="text-3xl mb-2">🌸</p>
                    <p>No history yet!</p>
                    <p class="text-xs mt-1">Start calculating sweet numbers~</p>
                </div>
            </div>

            <button id="clearHistory" class="mt-4 w-full py-2 bg-pink-100 hover:bg-pink-200 text-pink-600 font-semibold text-xs rounded-xl transition-colors flex items-center justify-center space-x-1">
                <i class="fas fa-trash-can"></i>
                <span>Clear History</span>
            </button>
        </div>
    </div>

    <script>
        // State Variables
        let currentInput = "0";
        let previousInput = "";
        let operation = null;
        let shouldResetDisplay = false;
        let history = [];
        let soundEnabled = true;

        // Themes
        const themes = [
            { name: "Pink Sparkle", class: "", label: "Pink Sparkle" },
            { name: "Pastel Dream", class: "theme-pastel", label: "Pastel Dream" },
            { name: "Lavender Glow", class: "theme-lavender", label: "Lavender Glow" }
        ];
        let currentThemeIndex = 0;

        // Easter Egg Triggers
        const easterEggs = {
            '777': "🎰 Lucky Triple 7! You get unlimited good vibes! ✨",
            '143': "💖 143 means I Love You! So sweet~ 🌸",
            '80085': "🎀 Classy cute humor! Hihi~ 💕",
            '1111': "✨ Make a wish! 11:11 magic! 💫",
            '0': "🌸 Starting fresh like a bloom! 🌺"
        };

        // DOM Elements
        const mainDisplay = document.getElementById('mainDisplay');
        const expressionDisplay = document.getElementById('expressionDisplay');
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeLabel = document.getElementById('themeLabel');
        const soundToggleBtn = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');
        const historyToggleBtn = document.getElementById('historyToggle');
        const historyDrawer = document.getElementById('historyDrawer');
        const closeHistoryBtn = document.getElementById('closeHistory');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistory');
        const historyBadge = document.getElementById('historyBadge');
        const easterEggToast = document.getElementById('easterEggToast');
        const easterEggText = document.getElementById('easterEggText');

        // --- WEB AUDIO API FOR POP & CLICK SOUNDS ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playCuteSound(freq = 600, type = 'sine') {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        function playEqualsSound() {
            if (!soundEnabled) return;
            try {
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    setTimeout(() => playCuteSound(freq, 'triangle'), idx * 50);
                });
            } catch (e) {}
        }

        // --- FLOATING BACKGROUND PARTICLES ---
        function createParticle() {
            const container = document.getElementById('particleContainer');
            const particle = document.createElement('div');
            particle.className = 'particle';

            const items = ['🌸', '✨', '💖', '🎀', '🍰', '⭐', '💫', '🧸'];
            particle.textContent = items[Math.floor(Math.random() * items.length)];

            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.fontSize = (Math.random() * 12 + 14) + 'px';
            particle.style.animationDuration = (Math.random() * 5 + 6) + 's';

            container.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 10000);
        }

        setInterval(createParticle, 800);
        for(let i = 0; i < 8; i++) createParticle();

        // --- SPARKLE BURST ANIMATION ---
        function triggerSparkleBurst(x, y) {
            const count = 12;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'burst-particle text-pink-400 font-bold';
                particle.textContent = ['✨', '💖', '⭐', '🌸'][Math.floor(Math.random() * 4)];
                
                const angle = (i / count) * Math.PI * 2;
                const dist = Math.random() * 60 + 40;
                const dx = Math.cos(angle) * dist + 'px';
                const dy = Math.sin(angle) * dist + 'px';

                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.setProperty('--dx', dx);
                particle.style.setProperty('--dy', dy);

                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 800);
            }
        }

        // --- CALCULATOR ENGINE ---
        function updateDisplay() {
            mainDisplay.textContent = formatNumber(currentInput);
            if (operation && previousInput !== "") {
                expressionDisplay.textContent = `${formatNumber(previousInput)} ${operation}`;
            } else {
                expressionDisplay.textContent = "Ready ~ 🌸";
            }
        }

        function formatNumber(numStr) {
            if (numStr === "Error") return "Error";
            if (numStr.endsWith('.')) return numStr;
            const parts = numStr.split('.');
            const num = parseFloat(parts[0]);
            if (isNaN(num)) return numStr;
            const formatted = num.toLocaleString('en-US', { maximumFractionDigits: 8 });
            return parts.length > 1 ? `${formatted}.${parts[1]}` : formatted;
        }

        function appendNumber(number) {
            if (currentInput === "0" || shouldResetDisplay) {
                currentInput = number;
                shouldResetDisplay = false;
            } else {
                if (currentInput.replace('.', '').length >= 10) return; // Limit length
                if (number === '.' && currentInput.includes('.')) return;
                currentInput += number;
            }
            checkEasterEgg(currentInput);
            updateDisplay();
        }

        function handleOperation(op) {
            if (operation !== null) calculateResult();
            previousInput = currentInput;
            operation = op;
            shouldResetDisplay = true;
            updateDisplay();
        }

        function calculateResult() {
            if (operation === null || shouldResetDisplay) return;

            let result = 0;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '×': result = prev * current; break;
                case '÷':
                    if (current === 0) {
                        result = "Error";
                        showToast("🌸 Oops! Can't divide by zero!");
                        break;
                    }
                    result = prev / current;
                    break;
            }

            if (result !== "Error") {
                // Round nicely to prevent precision issues
                result = Math.round(result * 1e8) / 1e8;
                addHistory(`${previousInput} ${operation} ${currentInput}`, result.toString());
            }

            currentInput = result.toString();
            operation = null;
            shouldResetDisplay = true;
            updateDisplay();
            playEqualsSound();
            checkEasterEgg(currentInput);
        }

        function clearAll() {
            currentInput = "0";
            previousInput = "";
            operation = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        function toggleSign() {
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        function computePercent() {
            currentInput = (parseFloat(currentInput) / 100).toString();
            updateDisplay();
        }

        function computeSqrt() {
            const num = parseFloat(currentInput);
            if (num < 0) {
                currentInput = "Error";
                showToast("🌸 Invalid input for √");
            } else {
                currentInput = (Math.sqrt(num)).toString();
            }
            updateDisplay();
        }

        function handleBackspace() {
            if (shouldResetDisplay) return;
            if (currentInput.length === 1 || currentInput === "Error") {
                currentInput = "0";
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        // --- EASTER EGGS ---
        function checkEasterEgg(val) {
            if (easterEggs[val]) {
                showToast(easterEggs[val]);
            }
        }

        function showToast(message) {
            easterEggText.textContent = message;
            easterEggToast.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                easterEggToast.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // --- HISTORY DRAWER MANAGEMENT ---
        function addHistory(expr, result) {
            history.unshift({ expr, result });
            if (history.length > 20) history.pop();
            renderHistory();
            historyBadge.classList.remove('hidden');
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = `
                    <div class="text-center text-pink-300 text-sm py-10">
                        <p class="text-3xl mb-2">🌸</p>
                        <p>No history yet!</p>
                        <p class="text-xs mt-1">Start calculating sweet numbers~</p>
                    </div>`;
                return;
            }

            historyList.innerHTML = history.map((item, idx) => `
                <div class="sticker w-full text-left p-3 cursor-pointer hover:scale-102 transition-transform mb-2" onclick="useHistoryResult('${item.result}')">
                    <div class="text-xs text-pink-400 font-medium">${item.expr} =</div>
                    <div class="text-lg font-bold text-pink-700">${item.result}</div>
                </div>
            `).join('');
        }

        window.useHistoryResult = function(res) {
            currentInput = res;
            shouldResetDisplay = false;
            updateDisplay();
            historyDrawer.classList.add('translate-x-full');
            playCuteSound(700);
        };

        // --- EVENT LISTENERS ---
        // Button Click Handlers
        document.querySelectorAll('.calc-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;

                // Visual button press bounce
                btn.classList.add('pressed');
                setTimeout(() => btn.classList.remove('pressed'), 150);

                if (btn.dataset.num) {
                    playCuteSound(500 + parseInt(btn.dataset.num) * 30);
                    appendNumber(btn.dataset.num);
                } else if (btn.dataset.op) {
                    playCuteSound(700, 'triangle');
                    handleOperation(btn.dataset.op);
                } else if (btn.dataset.action) {
                    const act = btn.dataset.action;
                    if (act === 'clear') {
                        playCuteSound(400);
                        triggerSparkleBurst(x, y);
                        clearAll();
                    } else if (act === 'calculate') {
                        calculateResult();
                    } else if (act === 'backspace') {
                        playCuteSound(450);
                        handleBackspace();
                    } else if (act === 'toggle-sign') {
                        playCuteSound(600);
                        toggleSign();
                    } else if (act === 'percent') {
                        playCuteSound(650);
                        computePercent();
                    } else if (act === 'sqrt') {
                        playCuteSound(680);
                        computeSqrt();
                    }
                }
            });
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                playCuteSound(500 + parseInt(e.key) * 30);
                appendNumber(e.key);
            } else if (e.key === '.') {
                playCuteSound(550);
                appendNumber('.');
            } else if (e.key === '+') {
                playCuteSound(700, 'triangle');
                handleOperation('+');
            } else if (e.key === '-') {
                playCuteSound(700, 'triangle');
                handleOperation('-');
            } else if (e.key === '*') {
                playCuteSound(700, 'triangle');
                handleOperation('×');
            } else if (e.key === '/') {
                e.preventDefault();
                playCuteSound(700, 'triangle');
                handleOperation('÷');
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculateResult();
            } else if (e.key === 'Backspace') {
                playCuteSound(450);
                handleBackspace();
            } else if (e.key === 'Escape') {
                playCuteSound(400);
                clearAll();
            }
        });

        // Theme Toggle Handler
        themeToggleBtn.addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const t = themes[currentThemeIndex];
            
            document.body.className = `min-h-screen flex items-center justify-center p-3 sm:p-6 relative overflow-x-hidden select-none ${t.class}`;
            themeLabel.textContent = t.label;
            playCuteSound(800, 'sine');
        });

        // Sound Mute Toggle
        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "fas fa-volume-up text-sm";
                playCuteSound(600);
            } else {
                soundIcon.className = "fas fa-volume-mute text-sm";
            }
        });

        // History Drawer Toggle
        historyToggleBtn.addEventListener('click', () => {
            historyDrawer.classList.remove('translate-x-full');
            historyBadge.classList.add('hidden');
            playCuteSound(600);
        });

        closeHistoryBtn.addEventListener('click', () => {
            historyDrawer.classList.add('translate-x-full');
            playCuteSound(500);
        });

        clearHistoryBtn.addEventListener('click', () => {
            history = [];
            renderHistory();
            playCuteSound(400);
        });

        // Initialize Display
        updateDisplay();
    </script>
</body>
</html>
